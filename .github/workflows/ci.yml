name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Tests connect as a non-superuser so row-level security is enforced.
      TEST_DATABASE_URL: postgres://vicisrota:vicisrota@localhost:5432/vicisrota_test
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Create test database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "create role vicisrota login password 'vicisrota'"
          psql -h localhost -U postgres -c "create database vicisrota_test owner vicisrota"
          psql -h localhost -U postgres -d vicisrota_test -c "alter schema public owner to vicisrota"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build --workspace @vicisrota/web
